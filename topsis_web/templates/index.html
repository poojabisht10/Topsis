<!doctype html>
<html>
  <head>
    <title>TOPSIS Web Service</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <div class="app">
      <div class="card">
        <div class="header">
          <h1>TOPSIS</h1>
        </div>

        <form method="POST" action="/submit" enctype="multipart/form-data">
          <div class="form-group">
            <label>Upload Dataset</label>

            <div class="file-box">
              <input type="file" name="file" required />
            </div>

            <div class="help">
              First column should contain model names, remaining columns should
              be numeric.
            </div>
          </div>

          <div class="form-group">
            <label>Weights</label>

            <input type="text" name="weights" placeholder="1,1,1,2" required />

            <div class="help">Comma-separated numeric values</div>
          </div>

          <div class="form-group">
            <label>Impacts</label>

            <input type="text" name="impacts" placeholder="+,+,-,+" required />

            <div class="help">Comma-separated values (+ or -)</div>
          </div>

          <div class="form-group">
            <label>Email (optional)</label>

            <input type="email" name="email" placeholder="example@gmail.com" />
          </div>

          <button type="submit">Run TOPSIS</button>
        </form>

        {% if message %}

        <div class="message">{{ message }}</div>

        {% endif %} {% if table %}

        <div class="result">
          <h3>Result</h3>

          <div class="table-container">{{ table|safe }}</div>
        </div>

        {% endif %}

        <div class="download-btn-wrapper">
          <a href="/static/data.xlsx" download class="download-btn">
            Download Sample File
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
